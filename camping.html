<!DOCTYPE html>
<html lang="hu">
<head>

</head>

      <p class="page-header__sub" id="campingPageSubtitle"></p>

  <main>
    <section class="camping-section">
      <div class="container">
        <div class="camping-intro reveal">
          <p id="campingIntro"></p>
        </div>

        <div class="camping-note reveal reveal-delay-2" id="campingNote"></div>
        <div class="camping-actions reveal reveal-delay-3">
          <a class="btn btn--primary" id="campingLink" href="#" target="_blank" rel="noopener"></a>

      </div>
    </section>

  <footer class="footer" id="footer"></footer>

  <script src="data/site.js"></script>
