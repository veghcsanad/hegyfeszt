<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" id="nav"></nav>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero__bg">
      <div class="glow-cranberry" style="top:-100px;left:-100px;"></div>
      <div class="glow-blue" style="bottom:-200px;right:-150px;"></div>
      <div class="hero__grid"></div>
    </div>
    <div class="hero__announce" id="heroAnnounce"></div>
    <div class="container hero__content">
      <div class="hero__eyebrow reveal" style="display: none;">
        <span class="tag tag--cranberry" id="heroEdition"></span>
        <span class="hero__location" id="heroLocation"></span>
      </div>
      <div class="hero__main">
        <h1 class="hero__headline reveal reveal-delay-1" id="heroHeadline"></h1>
        <div class="hero__side">
          <p class="hero__sub reveal reveal-delay-2" id="heroSub" style="display: none;"></p>
          <div class="hero__ctas reveal reveal-delay-3" id="heroCtas"></div>
          <div class="hero__countdown-inline reveal reveal-delay-4" id="heroCountdownInline">
            <div class="countdown__inner">
              <div class="countdown__label" id="heroCountdownLabel"></div>
              <div class="countdown__units" id="countdownUnitsInline"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="hero__scroll">
      <span id="heroScrollLabel"></span>
      <div class="hero__scroll-line"></div>
    </div>
  </section>

  <!-- Features -->
  <section class="features">
    <div class="container">
      <div class="features__header">
        <h2 class="features__title reveal reveal-delay-1" id="featuresTitle"></h2>
      </div>
      <div class="features__grid reveal reveal-delay-2" id="featuresGrid"></div>
    </div>
  </section>

  <!-- CTA Band -->
  <section class="cta-band">
    <div class="glow-cranberry" style="top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:400px;"></div>
    <div class="container cta-band__inner reveal">
      <div class="cta-band__text">
        <h2 class="cta-band__title" id="ctaBandTitle"></h2>
      </div>
      <a class="btn btn--primary" href="tickets.html" id="ctaBandLink"></a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="data/site.js"></script>
  <script src="data/home.js"></script>
  <script src="js/global.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
