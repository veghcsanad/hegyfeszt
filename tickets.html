<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/tickets.css">
</head>
<body>

  <nav class="nav scrolled" id="nav"></nav>

  <header class="page-header">
    <div class="container">
      <div class="section-label" id="ticketsPageSectionLabel"></div>
      <h1 class="page-header__title" id="ticketsPageTitle"></h1>
      <p class="page-header__sub" id="ticketNotice"></p>
      <div class="page-tabs reveal reveal-delay-1">
        <a class="page-tab page-tab--active" id="buyTicketsLink" href="#" target="_blank" rel="noopener"></a>
        <a class="page-tab" id="volunteerLink" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </header>

  <!-- Ticket tiers -->
  <section class="tickets-section">
    <div class="container">
      <div class="tickets-grid reveal" id="ticketsGrid"></div>
    </div>
  </section>

  <!-- Add-ons -->
  <section class="addons-section">
    <div class="container">
      <div class="section-label reveal" id="addonsSectionLabel"></div>
      <h2 class="addons-title reveal reveal-delay-1" id="addonsSectionTitle"></h2>
      <div class="addons-grid reveal reveal-delay-2" id="addonsGrid"></div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="faq-section">
    <div class="container faq-inner">
      <div>
        <div class="section-label reveal" id="faqSectionLabel"></div>
        <h2 class="faq-title reveal reveal-delay-1" id="faqSectionTitle"></h2>
      </div>
      <div class="faq-list reveal reveal-delay-2" id="faqList"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/tickets.js"></script>
  <script src="js/global.js"></script>
  <script src="js/tickets.js"></script>
</body>
</html>
