<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/volunteers.css">
</head>
<body>

  <nav class="nav scrolled" id="nav"></nav>

  <header class="page-header">
    <div class="container">
      <div class="section-label" id="volunteersPageSectionLabel"></div>
      <h1 class="page-header__title" id="volunteersPageTitle"></h1>
      <p class="page-header__sub" id="volunteersPageSubtitle"></p>
    </div>
  </header>

  <!-- Volunteer intro -->
  <section class="volunteer-intro">
    <div class="container">
      <div class="volunteer-intro-content reveal">
        <div class="volunteer-intro-copy">
          <p class="volunteer-intro-text" id="volunteerIntroText"></p>
        </div>
        <div class="volunteer-intro-media">
          <img class="volunteer-intro-image" id="volunteerIntroImage" src="images/volunteer.jpg" alt="Hegyfeszt önkéntesek">
        </div>
      </div>
    </div>
  </section>

  <!-- Tasks -->
  <section class="volunteer-tasks">
    <div class="container">
      <h2 class="tasks-title reveal reveal-delay-1" id="volunteerTasksTitle"></h2>
      <div class="tasks-grid reveal reveal-delay-2" id="tasksGrid"></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="volunteer-cta">
    <div class="glow-cranberry" style="top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:400px;"></div>
    <div class="container volunteer-cta-inner reveal">
      <div class="volunteer-cta-text">
        <h2 class="volunteer-cta-title" id="volunteerCtaTitle"></h2>
        <p class="volunteer-cta-sub" id="volunteerCtaSub"></p>
      </div>
      <a class="btn btn--primary" href="#" target="_blank" id="volunteerCtaLink"></a>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/about.js"></script>
  <script src="js/global.js"></script>
  <script src="js/volunteers.js"></script>
</body>
</html>
