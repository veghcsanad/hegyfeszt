<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/about.css">
</head>
<body>

  <nav class="nav scrolled" id="nav"></nav>

  <header class="page-header">
    <div class="container">
      <div class="section-label" id="aboutPageSectionLabel"></div>
      <h1 class="page-header__title" id="aboutPageTitle"></h1>
    </div>
  </header>

  <!-- Story -->
  <section class="story-section">
    <div class="container story-inner">
      <figure class="about-image-wrap reveal">
        <img id="aboutPageImage" class="about-image" src="images/about.jpg" alt="Hegyfeszt és a Kaleidoszkóp Ház">
      </figure>
      <div class="story-text" id="storyText"></div>
      <div class="story-stats" id="storyStats"></div>
    </div>
  </section>

  <div class="divider"></div>

  <div class="divider"></div>
  <!-- Venue -->
  <section class="venue-section">
    <div class="container">
      <div class="venue-inner">
        <div class="venue-text reveal reveal-delay-1" id="venueText"></div>
        <div class="venue-transport reveal reveal-delay-2" id="venueTransport"></div>
      </div>
    </div>
  </section>

  <!-- Support -->
  <section class="support-section">
    <div class="container">
      <div class="section-label reveal" id="supportSectionLabel"></div>
      <div class="support-content reveal reveal-delay-1" id="supportContent"></div>
    </div>
  </section>

  <!-- Impresszum -->
  <section class="impresszum-section">
    <div class="container">
      <div class="section-label reveal" id="impressumSectionLabel"></div>
      <div class="impressum-content reveal reveal-delay-1" id="impressumContent"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/about.js"></script>
  <script src="js/global.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
